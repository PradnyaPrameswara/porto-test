name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Generated site smoke tests
        run: pnpm test:site
      - name: Install Chromium for visual checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Responsive browser audit and screenshots
        run: pnpm test:visual
      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-audit
          path: visual-audit/
          if-no-files-found: ignore
      - name: Capture real shadcn.com comparison
        continue-on-error: true
        run: pnpm test:reference
      - name: Upload reference comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadcn-reference-comparison
          path: reference-audit/
          if-no-files-found: ignore
      - name: Portfolio browser acceptance checks
        run: pnpm test:acceptance
      - name: Upload previewable static build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-preview
          path: dist/
          if-no-files-found: error
      - name: Build GitHub Pages path-aware preview
        run: DEPLOY_TARGET=github-pages pnpm build
      - name: Verify GitHub Pages preview navigation
        run: pnpm test:pages
      - name: Upload GitHub Pages-ready preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-pages-preview
          path: dist/
          if-no-files-found: error
